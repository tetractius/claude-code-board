name: Release

# Cut a release by pushing a tag:  git tag v0.1.0 && git push origin v0.1.0
# Or run this workflow by hand and give it a tag name.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --arm64 --x64 --publish never
      - run: cp scripts/install-macos.sh release/
      - run: |
          for app in release/mac*/*.app; do codesign --verify --deep --strict "$app"; done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            release/*.dmg
            release/*.zip
            release/install-macos.sh

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux --x64 --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*.AppImage

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -lh dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Re-running a release must replace its files rather than fail, so
          # check for an existing one instead of relying on create's error.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists - replacing its assets"
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --notes-file .github/RELEASE_NOTES.md
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes-file .github/RELEASE_NOTES.md
          fi
